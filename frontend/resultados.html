<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultados - StreamFinder</title>
    <link rel="icon" type="image/png" href="Logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="resultados.js" defer></script>
</head>

<body class="pagina-resultados">
    <nav class="topo-nav">
        <ul>
            <li><a href="index.html">&larr; Nova busca</a></li>
        </ul>
    </nav>

    <!-- O resultados.js preenche a grade com os filmes que combinam com a busca -->
    <main class="resultados-main">
        <h2 id="resultados-titulo" class="resultados-titulo"></h2>
        <ul id="grade" class="grade" aria-live="polite"></ul>
        <p id="resultados-aviso" class="card-aviso" hidden></p>
        <button type="button" id="ver-mais" class="botao-secundario" hidden>Ver mais</button>
    </main>

    <footer>
        <p>&copy; 2026 StreamFinder. Todos os direitos reservados.</p>
        <p class="footer-credito">
            Dados de filmes do <a href="https://www.themoviedb.org" target="_blank" rel="noopener noreferrer">TMDB</a>
            e de streaming do <a href="https://www.justwatch.com" target="_blank" rel="noopener noreferrer">JustWatch</a>.
            Este produto usa a API do TMDB, mas não é endossado nem certificado por ele.
        </p>
    </footer>
</body>
</html>

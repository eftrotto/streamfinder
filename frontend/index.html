<!DOCTYPE html>
<!-- Boiler plate = ! +tab-->
<html lang="en" >
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFinder</title>
    <!-- Pro CSS funcionar no seu HTML vc tem que adicionar essa linha aqui debaixo, que linka o arquivo de estilo com o html -->
    <link rel="stylesheet" href="style.css">
    <!-- Linka o javascript -->
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <img src="Logo.png" alt="StreamFinder logo" id="logo">
        <!-- Ai aqui eu botei essa classe title, e lá no CSS eu defini o dela || e esse span é pra destacar aonde vai ficar roxo -->
        <h1 class="title"> Bem-vindo ao Stream<span>Finder</span>!</h1>
        <h4>
            Seu filme em qualquer lugar.
        </h4>
    </header>

    <main>
        <form id="search-form">
            <input 
                type="text" 
                id="movie-input" 
                placeholder="Digite o nome de um filme..." 
                required
            >
            <button type="submit">Buscar</button>
        </form>

        <p id="results"></p>

    </main>

    <footer>
        <p>&copy; 2026 StreamFinder. Todos os direitos reservados.</p>
        <nav>
            <a href="vgt@gmail.com">Fale conosco</a>
            <Br>
            <Br>
            <a href="/sobre">Saiba mais</a>
        </nav>
    </footer>
</body>
</html>

<!DOCTYPE html>
<!-- Boiler plate = ! +tab-->
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFinder</title>
    <!-- Pro CSS funcionar no seu HTML vc tem que adicionar essa linha aqui debaixo, que linka o arquivo de estilo com o html -->
    <link rel="stylesheet" href="style.css">
    <script src="config.js" defer></script>
    <script src="carrossel.js" defer></script>
</head>

<body>
    <header>
        <img src="Logo.png" alt="StreamFinder logo" id="logo">
        <!-- Ai aqui eu botei essa classe title, e lá no CSS eu defini o dela || e esse span é pra destacar aonde vai ficar roxo -->
        <h1 class="title"> Bem-vindo ao Stream<span>Finder</span>!</h1>
        <h4>
            Seu filme em qualquer lugar.
        </h4>
    </header>

    <main>
        <form id="search-form" action="filme.html" method="get">
            <input 
                type="text" 
                id="movie-input"
                name="busca"

                placeholder="Digite o nome de um filme..." 
                required
            >
            <button type="submit">Buscar</button>
        </form>

        <!-- Carrossel: fica escondido até a API responder (carrossel.js) -->
        <section id="populares" class="carrossel" aria-label="Filmes mais populares da semana" hidden>
            <h3 class="carrossel-titulo">Em alta esta semana</h3>
            <div class="carrossel-janela">
                <ul class="carrossel-trilho" id="carrossel-trilho"></ul>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StreamFinder. Todos os direitos reservados.</p>
        <nav>
            <a href="mailto:vgt@gmail.com">Fale conosco</a>
            <a href="https://github.com/eftrotto/streamfinder" target="_blank" rel="noopener noreferrer">Saiba mais</a>
        </nav>
    </footer>
</body>
</html>
